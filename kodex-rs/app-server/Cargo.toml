kodex-backend-client = { workspace = true }
kodex-file-search = { workspace = true }
kodex-chatgpt = { workspace = true }
kodex-login = { workspace = true }
kodex-image-generation-extension = { workspace = true }
kodex-memories-extension = { workspace = true }
kodex-web-search-extension = { workspace = true }
kodex-websocket-auth = { workspace = true }
kodex-memories-write = { workspace = true }
kodex-mcp = { workspace = true }
