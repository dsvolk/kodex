name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CI required
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kodex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.3.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest
      - name: Configure rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Check formatting
        run: just fmt-check
      - name: Build Kodex CLI
        run: cargo build --locked --bin kodex --bin kodex-code-mode-host
      - name: Verify Homebrew package layout
        env:
          KODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python3 ../scripts/build_kodex_package.py \
            --target aarch64-apple-darwin \
            --package-version "$package_version" \
            --package-dir "$RUNNER_TEMP/kodex-package" \
            --archive-output "$RUNNER_TEMP/kodex-package.tar.gz" \
            --entrypoint-bin "$CARGO_TARGET_DIR/debug/kodex" \
            --code-mode-host-bin "$CARGO_TARGET_DIR/debug/kodex-code-mode-host" \
            --force
      - name: Test Kodex CLI
        run: just test -p kodex-cli -E 'not binary(app_server_daemon)'
