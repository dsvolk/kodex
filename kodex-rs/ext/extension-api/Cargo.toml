kodex-tools = { workspace = true }
kodex-utils-absolute-path = { workspace = true }
kodex-utils-path-uri = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
