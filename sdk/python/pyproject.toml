[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "openai-kodex"
version = "0.0.0-dev"
description = "Python SDK for Kodex"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenAI" }]
keywords = ["kodex", "sdk", "llm", "ai", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.12", "packaging>=26.2", "openai-kodex-cli-bin==0.153.4"]

[project.urls]
Homepage = "https://github.com/openai/kodex"
Repository = "https://github.com/openai/kodex"
Issues = "https://github.com/openai/kodex/issues"
Documentation = "https://github.com/openai/kodex/tree/main/sdk/python/docs"

[dependency-groups]
format = ["ruff>=0.15.8"]
test = [
  "pytest>=8.0",
  "datamodel-code-generator==0.31.2",
  { include-group = "format" },
]
dev = [
  { include-group = "test" },
  { include-group = "format" },
]

[tool.kodex.codegen]
schema-dir = "../../kodex-rs/app-server-protocol/schema/json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
required-version = ">=0.15.8"
line-length = 100
extend-exclude = [
  "notebooks/**",
  "src/openai_kodex/generated/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]
preview = true
extend-safe-fixes = ["ALL"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
"tests/test_real_app_server_integration.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { openai-kodex-cli-bin = "2026-09-09T06:06:45Z" }
index-strategy = "first-index"

[tool.uv.pip]
exclude-newer = "7 days"
exclude-newer-package = { openai-kodex-cli-bin = "2026-09-09T06:06:45Z" }
index-strategy = "first-index"
