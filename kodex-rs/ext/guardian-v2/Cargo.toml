kodex-extension-api = { workspace = true }
kodex-features = { workspace = true }
kodex-guardian-context = { workspace = true }
kodex-guardian-reviewer = { workspace = true }
kodex-history = { workspace = true }
kodex-http-client = { workspace = true }
kodex-login = { workspace = true }
kodex-model-provider = { workspace = true }
kodex-protocol = { workspace = true }
kodex-prompts = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
