[package]
edition.workspace = true
license.workspace = true
name = "kodex-goal-extension"
version.workspace = true

[lib]
name = "kodex_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
kodex-analytics = { workspace = true }
kodex-core = { workspace = true }
kodex-extension-api = { workspace = true }
kodex-otel = { workspace = true }
kodex-prompts = { workspace = true }
kodex-protocol = { workspace = true }
kodex-rollout = { workspace = true }
kodex-state = { workspace = true }
kodex-tools = { workspace = true }
kodex-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
kodex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
