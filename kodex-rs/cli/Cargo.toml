[package]
name = "kodex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "kodex"

[[bin]]
name = "kodex"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "kodex_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
kodex-app-server = { workspace = true }
kodex-app-server-daemon = { workspace = true }
kodex-app-server-protocol = { workspace = true }
kodex-app-server-test-client = { workspace = true }
kodex-arg0 = { workspace = true }
kodex-build-info = { workspace = true }
kodex-api = { workspace = true }
kodex-aws-auth = { workspace = true }
kodex-chatgpt = { workspace = true }
kodex-cloud-config = { workspace = true }
kodex-cloud-tasks = { path = "../cloud-tasks" }
kodex-utils-cli = { workspace = true }
kodex-config = { workspace = true }
kodex-core = { workspace = true }
kodex-core-plugins = { workspace = true }
kodex-history = { workspace = true }
kodex-home = { workspace = true }
kodex-http-client = { workspace = true }
kodex-exec = { workspace = true }
kodex-exec-server = { workspace = true }
kodex-execpolicy = { workspace = true }
kodex-extension-api = { workspace = true }
kodex-features = { workspace = true }
kodex-git-attribution = { workspace = true }
kodex-git-utils = { workspace = true }
kodex-install-context = { workspace = true }
kodex-login = { workspace = true }
kodex-memories-write = { workspace = true }
kodex-mcp = { workspace = true }
kodex-model-provider = { workspace = true }
kodex-models-manager = { workspace = true }
kodex-plugin = { workspace = true }
kodex-protocol = { workspace = true }
kodex-responses-api-proxy = { workspace = true }
kodex-tcp-tunnel = { workspace = true }
kodex-rmcp-client = { workspace = true }
kodex-rollout = { workspace = true }
kodex-rollout-trace = { workspace = true }
kodex-sandboxing = { workspace = true }
kodex-skills-extension = { workspace = true }
kodex-state = { workspace = true }
kodex-stdio-to-uds = { workspace = true }
kodex-terminal-detection = { workspace = true }
kodex-thread-store = { workspace = true }
kodex-tui = { workspace = true }
kodex-utils-absolute-path = { workspace = true }
kodex-utils-path = { workspace = true }
kodex-utils-path-uri = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
kodex_windows_sandbox = { package = "kodex-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
kodex-utils-cargo-bin = { workspace = true }
kodex-utils-pty = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
