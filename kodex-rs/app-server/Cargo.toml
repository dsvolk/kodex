[package]
name = "kodex-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kodex-app-server"
path = "src/main.rs"

[[bin]]
name = "kodex-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "kodex_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
kodex-analytics = { workspace = true }
kodex-agent-extension = { workspace = true }
kodex-arg0 = { workspace = true }
kodex-aws-auth = { workspace = true }
kodex-cloud-config = { workspace = true }
kodex-code-mode = { workspace = true }
kodex-config = { workspace = true }
kodex-network-proxy = { workspace = true }
kodex-connectors = { workspace = true }
kodex-core = { workspace = true }
kodex-core-plugins = { workspace = true }
kodex-diagnostics = { workspace = true }
kodex-home = { workspace = true }
kodex-exec-server = { workspace = true }
kodex-extension-api = { workspace = true }
kodex-external-agent-migration = { workspace = true }
kodex-features = { workspace = true }
kodex-goal-extension = { workspace = true }
kodex-git-attribution = { workspace = true }
kodex-guardian-v2 = { workspace = true }
kodex-git-utils = { workspace = true }
kodex-file-watcher = { workspace = true }
kodex-hooks = { workspace = true }
kodex-history-notes-extension = { workspace = true }
kodex-http-client = { workspace = true }
kodex-otel = { workspace = true }
kodex-plugin = { workspace = true }
