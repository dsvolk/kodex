kodex-core = { workspace = true }
kodex-core-plugins = { workspace = true }
kodex-hooks = { workspace = true }
kodex-login = { workspace = true }
kodex-memories-write = { workspace = true }
kodex-otel = { workspace = true }
kodex-plugin = { workspace = true }
kodex-protocol = { workspace = true }
kodex-rollout = { workspace = true }
kodex-thread-store = { workspace = true }
kodex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
kodex-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
