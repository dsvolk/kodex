name: kodex-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: kodex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_OPT_LEVEL: z
    defaults:
      run:
        working-directory: kodex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Configure rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Verify release version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag_version" = "$manifest_version"
      - name: Build
        run: cargo build --locked --release --target "$TARGET" --bin kodex --bin kodex-code-mode-host
      - name: Package
        env:
          KODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 ../scripts/build_kodex_package.py \
            --target "$TARGET" \
            --package-version "${GITHUB_REF_NAME#v}" \
            --package-dir dist/package \
            --archive-output "dist/kodex-${GITHUB_REF_NAME}-${TARGET}.tar.gz" \
            --entrypoint-bin "target/$TARGET/release/kodex" \
            --code-mode-host-bin "target/$TARGET/release/kodex-code-mode-host" \
            --force
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kodex-aarch64-apple-darwin
          path: kodex-rs/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release and tap formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kodex-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAP_DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/homebrew_tap
          chmod 600 ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:dsvolk/homebrew-tap.git tap

          version="${GITHUB_REF_NAME#v}"
          arm_archive="kodex-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          arm_sha="$(sha256sum "dist/$arm_archive" | cut -d' ' -f1)"
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@TAG@/$GITHUB_REF_NAME/g" \
            -e "s/@ARM_ARCHIVE@/$arm_archive/g" \
            -e "s/@ARM_SHA@/$arm_sha/g" \
            formula/kodex.rb.tmpl > tap/Formula/kodex.rb

          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/kodex.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap commit -m "Update kodex to $version"
          git -C tap push
