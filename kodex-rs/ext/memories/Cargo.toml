[package]
edition.workspace = true
license.workspace = true
name = "kodex-memories-extension"
version.workspace = true

[lib]
name = "kodex_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
kodex-core = { workspace = true }
kodex-extension-api = { workspace = true }
kodex-features = { workspace = true }
kodex-otel = { workspace = true }
kodex-protocol = { workspace = true }
kodex-tools = { workspace = true }
kodex-utils-absolute-path = { workspace = true }
kodex-utils-output-truncation = { workspace = true }
kodex-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
