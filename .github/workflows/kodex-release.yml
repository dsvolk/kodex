name: kodex-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: kodex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    defaults:
      run:
        working-directory: kodex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Configure rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Verify release version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag_version" = "$manifest_version"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin kodex
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/$TARGET/release/kodex" dist/package/kodex
          tar -C dist/package -czf "dist/kodex-${GITHUB_REF_NAME}-${TARGET}.tar.gz" kodex
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kodex-${{ matrix.target }}
          path: kodex-rs/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release and tap formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kodex-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAP_DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/homebrew_tap
          chmod 600 ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:dsvolk/homebrew-tap.git tap

          version="${GITHUB_REF_NAME#v}"
          arm_archive="kodex-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          intel_archive="kodex-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
          arm_sha="$(sha256sum "dist/$arm_archive" | cut -d' ' -f1)"
          intel_sha="$(sha256sum "dist/$intel_archive" | cut -d' ' -f1)"
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@TAG@/$GITHUB_REF_NAME/g" \
            -e "s/@ARM_ARCHIVE@/$arm_archive/g" \
            -e "s/@ARM_SHA@/$arm_sha/g" \
            -e "s/@INTEL_ARCHIVE@/$intel_archive/g" \
            -e "s/@INTEL_SHA@/$intel_sha/g" \
            formula/kodex.rb.tmpl > tap/Formula/kodex.rb

          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/kodex.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap commit -m "Update kodex to $version"
          git -C tap push
